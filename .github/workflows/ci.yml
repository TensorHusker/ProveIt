name: CI

# Workflow triggers
# - Runs on push to main branch
# - Runs on all pull request events
# - Can be manually triggered via workflow_dispatch
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Improve error messages from Cargo
  RUST_BACKTRACE: 1

jobs:
  # Code formatting check
  # Ensures all Rust code follows consistent formatting
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

  # Clippy linting
  # Catches common mistakes and enforces Rust best practices
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache key includes the job name for isolation
          key: clippy

      - name: Run Clippy
        run: cargo clippy --all-features --workspace -- -D warnings

  # Build and test on multiple platforms
  # Tests the codebase on Linux, macOS, and Windows
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Continue running other jobs even if one fails
      # This allows us to see all platform-specific issues
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Platform-specific cache keys
          key: ${{ matrix.os }}

      - name: Build workspace (debug)
        run: cargo build --all-features --workspace

      - name: Run tests
        run: cargo test --all-features --workspace

      - name: Build workspace (release)
        run: cargo build --release --workspace

  # Documentation build check
  # Ensures that documentation can be generated without errors
  # This helps maintain good documentation quality
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: Build documentation
        # RUSTDOCFLAGS ensures warnings are treated as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  # WebAssembly build check (Linux only)
  # Verifies that the codebase can be compiled to WASM
  # This is optional and only runs on Linux for efficiency
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Build for WASM target
        run: cargo build --target wasm32-unknown-unknown --workspace

  # Final status check
  # This job ensures all required checks have passed
  # It's useful for branch protection rules
  ci-success:
    name: CI Success
    needs: [fmt, clippy, build-and-test, docs, wasm]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: Check all jobs succeeded
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled"
          exit 1
      
      - name: CI passed
        run: echo "All CI checks passed successfully!"
